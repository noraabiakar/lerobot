$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
command: >-
 python -m lerobot.scripts.train \
    --policy.path=${{outputs.PI0FAST_CHECKPOINT}}\
    --policy.device=cuda \
    --output_dir=${{outputs.MODEL_OUTPUTS}}/goat_picking_pi0fast_v1 \
    --job_name=pi0fast_so101_goat \
    --dataset.repo_id=noraabk/so101-goat-picking-v1 \
    --dataset.root=${{outputs.MODEL_INPUTS}} \
    --batch_size=16 \
    --steps 50000 \
    --save_freq 5000
environment: azureml:lerobot-openpi0-env:6
outputs:
  MODEL_OUTPUTS:
    type: uri_folder
    path: azureml://datastores/nora_datasets/paths/outputs
  MODEL_INPUTS:
    type: uri_folder
    path: azureml://datastores/nora_datasets/paths/inputs/so101-goat-picking-v1
  PI0FAST_CHECKPOINT:
    type: uri_folder
    path: azureml://datastores/nora_datasets/paths/pi0fast_base
display_name: pi0fast_goat_picking_finetuning
experiment_name: pi0fast_goat_picking_finetuning
compute: nc80adis-h100-v5-single
code: ..
environment_variables:
  HF_TOKEN: ""